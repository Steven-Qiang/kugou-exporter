name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint, no auto-fix)
        run: pnpm exec eslint .

      - name: Type-check launcher
        run: pnpm exec tsc -p apps/launcher/tsconfig.json

      - name: Tests
        run: pnpm test

      - name: Build (web + launcher)
        run: pnpm build
