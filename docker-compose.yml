services:
  kugou-exporter:
    # 本地构建：项目未发布时无需从 Docker Hub 拉取（发布后可直接 `docker pull stevenxuq/kugou-exporter`）
    build: .
    container_name: kugou-exporter
    ports:
      - '3000:3000'
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production
